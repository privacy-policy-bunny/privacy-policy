  "article 191": "Disqualifications for State Legislature membership: (a) office of profit under Government of India/State (except offices exempted by State law), (b) unsound mind declared by competent court, (c) undischarged insolvent, (d) not citizen of India or voluntary acquisition/allegiance to foreign State, (e) disqualification by/under Parliamentary law. Clause (2): disqualification also under Tenth Schedule (anti-defection).",
  "article 192": "Decision on questions of disqualification under Article 191(1): if question arises whether a sitting member has become disqualified, it is referred to Governor; Governor acts according to Election Commission's opinion. Decision is treated as final in constitutional text, subject to limited judicial review.",
  "article 193": "Penalty for sitting and voting before oath or when disqualified: a person who knowingly sits or votes in State Legislature before making oath under Article 188, or while not qualified/disqualified/prohibited by law, is liable to penalty of Rs. 500 for each day, recoverable as debt due to the State.",
  "article 194": "Powers, privileges and immunities of State Legislatures and members: subject to Constitution and House rules, there is freedom of speech in Legislature; no member is liable in court for speech/vote in Legislature or committee; no liability for authorized publication of reports/papers/proceedings. Other powers/privileges are as defined by State Legislature by law, and until so defined, as those existing immediately before Section 26 of the 44th Amendment came into force.",
  "article 195": "Salaries and allowances of State Legislature members are determined by State Legislature by law and, until such provision is made, as specified in the Second Schedule.",
  "article 196": "Provisions as to introduction and passing of Bills (other than Money Bills): Bill may originate in either House of a bicameral State and must be passed by both Houses (subject to Article 197). Bill pending in Legislature does not lapse by prorogation. On dissolution of Assembly: Bill pending in Council but not passed by Assembly does not lapse; Bill pending in Assembly, or passed by Assembly and pending in Council, lapses.",
  "article 197": "Restriction on powers of Legislative Council as to Bills other than Money Bills: if Assembly Bill is rejected/delayed/amended unacceptably by Council, Assembly may pass it again (same session or next) and send to Council; if Council again rejects, delays beyond one month, or returns unacceptable amendments, Bill is deemed passed in form passed by Assembly second time (with only Assembly-accepted Council amendments, if any). No joint sitting mechanism exists at State level.",
  "article 198": "Special procedure for Money Bills in States: Money Bill cannot be introduced in Legislative Council. After Assembly passes and transmits it, Council has 14 days to return with recommendations; Assembly may accept/reject recommendations. If Council does not return within 14 days, Bill is deemed passed in Assembly form.",
  "article 199": "Definition of Money Bill (State analogue of Article 110): Bill is Money Bill only if it contains only provisions dealing with matters in clauses (a)-(g) such as State taxation, State borrowing/guarantees, custody/appropriation of Consolidated Fund or Contingency Fund of State, charged expenditure, public account, and incidental matters. Not Money Bill merely because of fines/fees/local taxation. Speaker's decision on Money Bill question is final in constitutional text; certificate is endorsed on Bill.",
  "article 200": "Assent to Bills by Governor: when Bill is presented, Governor may assent, withhold assent, or reserve Bill for President's consideration. For a Bill other than Money Bill, Governor may return once with message for reconsideration; if House(s) pass it again with/without amendments and present again, Governor shall not withhold assent. Mandatory reservation trap: if, in Governor's opinion, Bill would so derogate from powers of High Court as to endanger its constitutional position, Governor shall reserve it for President.",
  "article 201": "Bills reserved for President: President may assent or withhold assent; if reserved Bill is not Money Bill, President may direct Governor to return it to State Legislature with message. If reconsidered and passed again within six months (with/without amendments) and re-presented to President, President is not constitutionally bound to assent.",
  "article 202": "Annual Financial Statement of State (State Budget): Governor causes to be laid before House/each House statement of estimated receipts and expenditure for financial year, distinguishing expenditure charged on Consolidated Fund of State from expenditure to be voted, and distinguishing revenue and other expenditure.",
  "article 203": "Procedure in State Legislature with respect to estimates: charged expenditure on Consolidated Fund of State is not submitted to vote (though discussable); other expenditure is submitted as Demands for Grants to Assembly. Assembly may assent, refuse or reduce a demand, but cannot increase it. No demand for grant can be made except on Governor's recommendation.",
  "article 204": "Appropriation Bills in States: after Demands for Grants are voted, Appropriation Bill is introduced to authorize withdrawal from Consolidated Fund of State for voted grants and charged expenditure. No amendment may vary amount/destination of any grant or charged expenditure; decision of presiding officer on admissibility is final.",
  "article 205": "Supplementary, additional and excess grants in States: if budgeted amount is insufficient, a new service arises, or excess expenditure has occurred, Governor causes another statement/demand to be laid; constitutional procedure of budget and grants applies correspondingly.",
  "article 206": "Votes on account, votes of credit and exceptional grants (States): Assembly may make advance grant pending full budget, grant for unexpected demand of indefinite character, or exceptional grant for special purpose not part of current service; implementation follows statutory appropriation process.",
  "article 207": "Special provisions as to Financial Bills in States: Bill containing matters in Article 199(1) with other matters cannot be introduced except on Governor's recommendation and cannot originate in Council. Bill making provision for expenditure from Consolidated Fund of State cannot be passed unless Governor has recommended consideration; tax-reduction/amendment exceptions apply as constitutionally provided.",
  "article 208": "Rules of procedure in State Legislature: each House may make rules for its procedure/conduct of business, subject to Constitution. Until such rules are made, pre-Constitution legislative procedure rules continue with adaptations as needed.",
  "article 209": "Regulation by law of State Legislature financial procedure: State Legislature may by law regulate procedure and conduct of financial business in relation to timely completion; such law prevails over inconsistent House rules under Article 208.",
  "article 210": "Language in State Legislature: business may be transacted in official language(s) of State, Hindi or English; presiding officer may permit a member unable to express adequately in these to speak in mother tongue. English continuation beyond transition period is governed by constitutional/statutory provisions.",
  "article 211": "Restriction on discussion in State Legislature: conduct of any Supreme Court or High Court judge in discharge of duties shall not be discussed, except on motion for presenting address to President seeking removal of judge.",
  "article 212": "Courts not to inquire into State legislative proceedings on ground of procedural irregularity; officers/members exercising powers for regulating procedure/conduct of business/maintaining order in Legislature are not subject to court jurisdiction for such exercise.",
  "article 214": "High Courts for States: there shall be a High Court for each State, subject to Article 231 which allows a common High Court for two or more States/State and Union Territory.",
  "article 215": "High Court to be a Court of Record: has power to preserve records with evidentiary authority and to punish for contempt of itself.",
  "article 216": "Constitution of High Court: consists of Chief Justice and such other judges as President may from time to time deem necessary.",
  "article 217": "Appointment and conditions of office of High Court judges: appointed by President by warrant under hand and seal after consultation with CJI, Governor of State, and (for judges other than Chief Justice) Chief Justice of that High Court. Qualifications: citizen of India and at least 10 years judicial office in India or 10 years advocate of High Court(s). Tenure is up to age 62; resignation to President; removal by process applicable to Supreme Court judges. Disputes on age are decided by President after prescribed consultation and decision is final in constitutional text.",
  "article 218": "Application of certain Supreme Court provisions to High Courts: Article 124(4) and 124(5) (removal process and enabling law) apply to High Court judges.",
  "article 219": "Oath or affirmation of High Court judges: before entering office, oath in Third Schedule form is made before Governor or person appointed by him (includes allegiance to Constitution and upholding sovereignty and integrity of India).",
  "article 220": "Restriction on post-retirement practice: a permanent High Court judge cannot plead/act in any court or authority in India except the Supreme Court and other High Courts.",
  "article 221": "Salaries and allowances of High Court judges are determined by Parliament by law and, until so provided, by Second Schedule; they cannot be varied to judge's disadvantage after appointment except under Financial Emergency. Salaries/allowances are charged on Consolidated Fund of the State; pension is charged on Consolidated Fund of India.",
  "article 222": "Transfer of High Court judge: President may transfer a judge from one High Court to another after consultation with CJI; transferred judge is entitled to compensatory allowance as determined by Parliament by law (or by President until law provides).",
  "article 223": "Appointment of Acting Chief Justice: when office of Chief Justice of High Court is vacant, or CJ is absent/unable to perform duties, President may appoint one of other judges of that High Court to perform duties of office.",
  "article 224": "Appointment of additional and acting High Court judges: President may appoint duly qualified persons as additional judges for period not exceeding two years when temporary increase in business or arrears exists; President may appoint an acting judge when a High Court judge (other than Chief Justice) is unable to perform duties or is appointed to act temporarily as Chief Justice. Retirement age remains 62 years.",
  "article 224A": "Appointment of retired judges at sittings of High Court: Chief Justice of High Court, with previous consent of President, may request a retired High Court judge (or person who has held such office) to sit and act as judge; consent of the retired judge is mandatory. While so sitting, he has all jurisdiction, powers and privileges of a High Court judge.",
  "article 225": "Jurisdiction of existing High Courts preserved subject to Constitution and laws made by competent legislature: includes jurisdiction/powers and law administered, along with power to make court rules and regulate sittings. Existing restrictions relating to revenue matters continue unless altered by competent law.",
  "article 226": "Power of High Courts to issue writs/directions/orders: includes habeas corpus, mandamus, prohibition, certiorari and quo warranto for enforcement of Fundamental Rights and for any other purpose (wider than Article 32). Territorial reach includes cases where cause of action arises wholly or partly within its territory even if authority/government seat is outside; this power is in addition to, not in derogation of, Supreme Court power under Article 32.",
  "article 226A": "Constitutional validity of Central laws: Repealed by the 43rd Amendment Act 1977.",
  "article 227": "Power of superintendence of High Courts: every High Court has superintendence over all courts and tribunals within its territory (except those constituted under laws relating to Armed Forces). It may call for returns, make/general issue rules and prescribe forms for regulating practice/proceedings of such courts/tribunals.",
  "article 228": "Transfer of certain cases to High Court: if a case pending in subordinate court involves substantial question of constitutional interpretation and determination of that question is necessary for disposal, High Court may withdraw the case and either dispose of it itself or decide constitutional question and return case to subordinate court with its judgment on that question.",
  "article 229": "Officers and servants of High Court: appointments are made by Chief Justice (or authorized judge/officer), subject to Parliamentary/State law. Conditions of service are prescribed by rules of Chief Justice, with Governor's approval required on matters of salaries/allowances/leave/pensions as specified. Administrative expenses of High Court are charged on Consolidated Fund of the State.",
  "article 230": "Parliament may by law extend jurisdiction of a High Court to, or exclude its jurisdiction from, a Union Territory.",
  "article 231": "Parliament may by law establish a common High Court for two or more States, or for two or more States and a Union Territory.",
  "article 232": "Article 232 (appointment of District Judges in certain cases) stood omitted by the Constitution (Seventh Amendment) Act, 1956.",
  "article 233": "Appointment of district judges: appointments/postings/promotions in State judicial service of district judges are made by Governor in consultation with High Court. A person not already in Union/State service is eligible for appointment only if he has been for at least seven years an advocate or pleader and is recommended by High Court.",
  "article 233A": "Validation of certain District Judges: Inserted by 20th Amendment 1966 to validate appointments and judgments that were found procedurally irregular regarding Articles 233 and 235.",
  "article 234": "Recruitment of persons other than district judges to State judicial service: made by Governor in accordance with rules framed after consultation with State Public Service Commission and High Court having jurisdiction in relation to such State.",
  "article 235": "Control over subordinate courts: posting, promotion and grant of leave of persons in judicial service of a State and holding posts inferior to district judge are vested in High Court; this secures independence of subordinate judiciary from executive control.",
  "article 236": "Interpretation for this chapter: 'district judge' includes judge of city civil court, additional district judge, joint district judge, assistant district judge, chief judge of small cause court, chief presidency magistrate, additional chief presidency magistrate, sessions judge, additional sessions judge and assistant sessions judge; 'judicial service' means service consisting exclusively of persons intended to fill post of district judge and other civil judicial posts inferior thereto.",
  "article 237": "Application of this chapter to certain classes of magistrates: Governor may, by public notification, direct that provisions of this chapter and rules made thereunder apply to any class/classes of magistrates in State with specified exceptions/modifications.",
  "article 238": "Article 238 (application of Part VI provisions to certain States) stood repealed by the Constitution (Seventh Amendment) Act, 1956.",
  "article 239": "Administration of Union Territories: every UT is administered by President acting through an Administrator appointed by him with such designation as specified. President may appoint Governor of a State as Administrator of adjoining UT, and in that capacity he acts independently of State Council of Ministers.",
  "article 239A": "Creation of local Legislatures or Council of Ministers for certain UTs: Parliament may by law create Legislature and/or Council of Ministers (or both) for UT of Puducherry with specified constitution/powers/functions; such law is not deemed constitutional amendment under Article 368.",
  "article 239AA": "Special provisions for National Capital Territory of Delhi: Delhi remains a UT called NCT of Delhi with a Legislative Assembly and a Council of Ministers (size capped at 10% of total Assembly membership) to aid and advise LG in matters where Assembly has law-making power. Assembly cannot legislate on State List Entries 1 (public order), 2 (police), 18 (land) and related Entries 64/65/66 insofar as they relate to these. On difference between LG and Ministers, LG may refer matter to President and act as constitutionally provided.",
  "article 239AB": "Failure of constitutional machinery in NCT Delhi: if President is satisfied that administration of NCT cannot be carried on in accordance with Article 239AA or for proper administration, President may suspend operation of any provision of Article 239AA or laws made under it and make consequential/incidental provisions.",
  "article 239B": "Ordinance-making power of Administrator (Puducherry framework): when Legislature is not in session, Administrator may promulgate Ordinance with prior instructions of President; Ordinance has same force as UT law but must be laid before Legislature and ceases six weeks after reassembly (or earlier on disapproval/withdrawal).",
  "article 240": "Power of President to make regulations for certain UTs: President may make regulations for peace, progress and good government of Andaman & Nicobar Islands, Lakshadweep, Dadra & Nagar Haveli and Daman & Diu, and Puducherry (in specified constitutional situations). Such regulation may repeal/amend Parliamentary law or other applicable law for that UT and has same force as Act of Parliament.",
  "article 241": "High Courts for Union Territories: Parliament may by law constitute a High Court for a UT or declare any court in a UT to be a High Court for all or any constitutional purposes; Parliament may also extend/exclude jurisdiction of a High Court to/from UTs by law.",
  "article 242": "Article 242 (administration of Coorg) stood omitted by the Constitution (Seventh Amendment) Act, 1956.",
  "article 244": "Administration of Scheduled Areas and Tribal Areas: provisions of Fifth Schedule apply to administration/control of Scheduled Areas and Scheduled Tribes in States other than Assam, Meghalaya, Tripura and Mizoram; provisions of Sixth Schedule apply to administration of tribal areas in Assam, Meghalaya, Tripura and Mizoram.",
  "article 244A": "Formation of autonomous State within Assam: notwithstanding Constitution, Parliament may by law form within Assam an autonomous State comprising specified tribal areas in Sixth Schedule and create for it a local Legislature, Council of Ministers, or both, with powers/functions/financial arrangements defined by Parliamentary law.",
  "article 245": "Extent of laws made by Parliament and State Legislatures: Parliament may make laws for whole or any part of India; State Legislature may make laws for whole or any part of the State. Parliamentary law is not invalid merely for extra-territorial operation; State law relies on territorial nexus doctrine for permissible extra-territorial connections.",
  "article 246": "Subject-matter of laws (Seventh Schedule distribution): Parliament has exclusive power over Union List (List I); States have exclusive power over State List (List II), subject to constitutional exceptions; both can legislate on Concurrent List (List III), with Union primacy on conflict via Article 254.",
  "article 246A": "Special provision on GST (inserted by 101st Amendment): notwithstanding Articles 246/254, Parliament and State Legislatures have concurrent power to make GST laws; Parliament has exclusive power for GST on inter-State supply (read with Article 269A).",
  "article 247": "Power of Parliament to establish additional courts for better administration of laws made by Parliament on matters in Union List.",
  "article 248": "Residuary legislative power: Parliament has exclusive power to legislate on matters not enumerated in Concurrent or State List, including residuary taxation.",
  "article 249": "Parliament's power to legislate on State List in national interest: if Rajya Sabha passes resolution supported by not less than two-thirds of members present and voting, Parliament may legislate on specified State List matter for whole/part of India. Resolution lasts one year and may be renewed annually. Such law ceases six months after resolution ceases, except for past actions done under it.",
  "article 250": "Parliament's power to legislate on State List during National Emergency: while Proclamation of Emergency is in operation, Parliament can legislate on State List for whole/part of India; such law ceases six months after Emergency ends, except for past actions done under it.",
  "article 251": "Inconsistency between laws made under Articles 249/250 and State laws: parliamentary law prevails over State law to extent of repugnancy while parliamentary law is in force.",
  "article 252": "Parliamentary legislation for two or more States by consent: if two or more State Legislatures pass resolutions that Parliament should legislate on a State List matter, Parliament may legislate for those States; other States may adopt later by resolution. Such Parliamentary law can be amended/repealed only by Parliament (not by States) though on like resolution mechanism.",
  "article 253": "Parliament's power to implement international treaties/agreements/conventions: notwithstanding federal distribution, Parliament may legislate for whole or any part of India to give effect to international obligations.",
  "article 254": "Repugnancy in Concurrent List: if State law conflicts with Parliamentary law, Parliamentary law prevails and State law is void to extent of repugnancy. Exception: State law reserved for and assented to by President prevails in that State, but Parliament can later override/amend/repeal it.",
  "article 255": "Procedural recommendation/sanction safeguard: law is not invalid merely because required prior recommendation/sanction under Constitution was absent, if the relevant assent (President or Governor, as applicable) has ultimately been given.",
  "article 256": "Obligation of States and Union directions: State executive power shall ensure compliance with Parliamentary laws and existing laws applying in that State; Union executive power extends to giving directions to a State for that purpose.",
  "article 257": "Control of Union over States in certain cases: State executive power shall not impede Union executive power; Union may issue directions accordingly. Union may also direct States on construction/maintenance of means of communication of national/military importance and measures for protection of railways; additional costs in carrying out such directions are compensated as constitutionally provided.",
  "article 257A": "Article 257A (assistance to States by deployment of Union forces) was inserted by 42nd Amendment and omitted by 44th Amendment.",
  "article 258": "Power of Union to confer functions on States: President may, with consent of State Government, entrust Union executive functions to that State or its officers, conditionally or unconditionally; Parliament may also confer powers and impose duties on State authorities for Union laws.",
  "article 258A": "Power of States to entrust functions to Union: Governor of a State may, with consent of Government of India, entrust State executive functions to Union Government or its officers, conditionally or unconditionally.",
  "article 259": "Article 259 (Armed Forces in Part B States) stood repealed by the Constitution (Seventh Amendment) Act, 1956.",
  "article 260": "Jurisdiction of Union in relation to territories outside India: Government of India may, by agreement with government of a foreign territory, undertake executive/legislative/judicial functions vested in that government, subject to and governed by law relating to exercise of foreign jurisdiction.",
  "article 261": "Full faith and credit: public acts, records and judicial proceedings of Union and every State receive full faith and credit throughout India. Final judgments/orders in civil proceedings are capable of execution anywhere in India according to law.",
  "article 262": "Adjudication of inter-State river water disputes: Parliament may by law provide adjudication mechanism for disputes relating to waters of inter-State rivers/river valleys and may by law exclude jurisdiction of Supreme Court and other courts in such disputes.",
  "article 263": "Inter-State Council: if President considers that public interests would be served, he may establish a Council to inquire into and advise on inter-State disputes, discuss subjects of common interest among Union and States, and make recommendations for better policy coordination.",
  "article 264": "Interpretation for Part XII, Chapter I (Finance): key terms used in fiscal distribution provisions are to be read as constitutionally defined for Union-State financial relations.",
  "article 265": "No tax shall be levied or collected except by authority of law; UPSC trap: both levy and collection require legal authority.",
  "article 266": "Consolidated Funds and Public Accounts: all revenues received by Government of India and loans raised form Consolidated Fund of India; similarly for each State's Consolidated Fund. Other public moneys received are credited to Public Account. No money from Consolidated Fund can be appropriated except in accordance with law and constitutional procedure.",
  "article 267": "Contingency Fund: Parliament may establish Contingency Fund of India and State Legislature may establish Contingency Fund of State for urgent/unforeseen expenditure pending legislative authorization.",
  "article 268": "Certain duties levied by Union but collected and appropriated by States (within State): includes stamp duties and duties of excise on medicinal and toilet preparations as constitutionally specified.",
  "article 268A": "Article 268A (service tax) was inserted by 88th Amendment and omitted by 101st Amendment with GST restructuring.",
  "article 269": "Taxes levied and collected by Union but assigned to States in manner provided by Parliamentary law (on principles for inter-State transactions as constitutionally framed).",
  "article 269A": "GST on supplies in course of inter-State trade/commerce is levied and collected by Government of India and apportioned between Union and States in manner provided by Parliament on recommendation of GST Council; import is deemed inter-State supply.",
  "article 270": "Distribution of certain taxes between Union and States: taxes/duties referred in this article are levied and collected by Union and distributed between Union and States in prescribed shares; distribution principles are based on Finance Commission recommendations and constitutional/statutory scheme.",
  "article 271": "Surcharge for purposes of Union: notwithstanding Articles 269 and 270, Parliament may at any time increase duties/taxes referred there by surcharge for Union purposes; entire proceeds belong to Union.",
  "article 272": "Article 272 (taxes levied and distributed between Union and States) stood omitted by the Constitution (Eightieth Amendment) Act, 2000.",
  "article 273": "Grants in lieu of export duty on jute and jute products: constitutional transitional grant provision for specified States, subject to constitutional conditions and temporal framework.",
  "article 274": "Prior recommendation of President required for certain taxation Bills affecting States' interests (for example, Bills varying principles of distribution or affecting surcharge/taxation structure in specified constitutional ways).",
  "article 275": "Grants from Union to certain States: Parliament may provide statutory grants-in-aid of revenues of States in need of assistance; special grants for welfare of Scheduled Tribes and administration of Scheduled Areas/tribal areas are constitutionally envisaged.",
  "article 276": "Taxes on professions, trades, callings and employments: States/local authorities may levy such taxes subject to constitutional ceiling per person per year (as amended by Parliament); this does not limit Parliament's power to tax income under Union law.",
  "article 277": "Savings clause for pre-Constitution taxes/fees/cesses: certain existing State/local levies may continue until Parliament otherwise provides, notwithstanding distribution changes.",
  "article 278": "Article 278 (agreements with Part B States) stood omitted by the Constitution (Seventh Amendment) Act, 1956.",
  "article 279": "Calculation of 'net proceeds' and related fiscal figures for constitutional distribution is determined and certified by CAG; CAG's certificate is final in constitutional text.",
  "article 279A": "GST Council (101st Amendment): constituted by President; Chairperson is Union Finance Minister, with Union MoS (Finance/Revenue) and State Finance/Taxation Ministers as members. Quorum is one-half of total members. Decisions require not less than three-fourths of weighted votes of members present and voting (Union weight one-third, States together two-thirds).",
  "article 280": "Finance Commission: President constitutes Finance Commission every five years or earlier as needed; Commission (Chairman + four members) recommends distribution of net tax proceeds between Union and States, allocation among States, principles for grants-in-aid under Article 275, and other referred fiscal matters (including local body augmentation under later constitutional provisions).",
  "article 281": "Finance Commission recommendations and explanatory memorandum as to action taken are laid before each House of Parliament by President.",
  "article 282": "Discretionary grants for public purpose: Union or State may make grants for any public purpose, even if the subject lies outside its legislative competence. UPSC link: constitutional basis often cited for grants-in-aid style schemes.",
  "article 283": "Custody and operation of Consolidated Funds, Contingency Funds, and Public Accounts of Union and States are regulated by constitutional and statutory rules made under this article.",
  "article 284": "Moneys received by public servants and courts (for example, suitors' deposits) are to be paid into the appropriate public account and handled as per law.",
  "article 285": "Union property is exempt from State taxation unless Parliament otherwise provides; constitutional savings exist for certain pre-Constitution levies until Parliament legislates.",
  "article 286": "States cannot tax supply/sale of goods or services when transaction is outside the State or in course of import/export; Parliament formulates principles for determining such transactions.",

    let bookmarks = JSON.parse(localStorage.getItem('bookmarks_2026')) || [];
    let activeKey = "";
    let isSidebarCollapsed = localStorage.getItem('sidebar_collapsed_2026') === '1';

    function applySidebarState() {
        document.body.classList.toggle('sidebar-collapsed', isSidebarCollapsed);
        const icon = document.getElementById('sidebarToggleIcon');
        const btn = document.getElementById('sidebarToggle');
        if (isSidebarCollapsed) {
            icon.className = 'fa-solid fa-angles-right';
            btn.title = "Show sidebar";
        } else {
            icon.className = 'fa-solid fa-angles-left';
            btn.title = "Hide sidebar";
        }
    }

    function toggleSidebar() {
        isSidebarCollapsed = !isSidebarCollapsed;
        localStorage.setItem('sidebar_collapsed_2026', isSidebarCollapsed ? '1' : '0');
        applySidebarState();
    }

    function keyToId(key) {
        return `article-${key.toLowerCase().replace(/[^a-z0-9]+/g, '-')}`;
    }

    function escapeHtml(text) {
        return String(text)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function updateBookmarkButton() {
        const btn = document.getElementById('bookmarkBtn');
        if (!activeKey) {
            btn.classList.remove('active');
            btn.innerHTML = '<i class="fa-regular fa-star"></i>';
            btn.title = "Select an article from the left to bookmark";
            return;
        }

        const isSaved = bookmarks.includes(activeKey);
        btn.classList.toggle('active', isSaved);
        btn.innerHTML = isSaved ? '<i class="fa-solid fa-star"></i>' : '<i class="fa-regular fa-star"></i>';
        btn.title = `Bookmark ${activeKey}`;
    }

    function setStarButtonState(button, key) {
        const isSaved = bookmarks.includes(key);
        button.classList.toggle('active', isSaved);
        button.innerHTML = isSaved ? '<i class="fa-solid fa-star"></i>' : '<i class="fa-regular fa-star"></i>';
        const title = isSaved ? `Remove bookmark for ${key}` : `Bookmark ${key}`;
        button.title = title;
        button.setAttribute('aria-label', title);
    }

    function syncArticleStarButtons(targetKey = "") {
        const targetEncoded = targetKey ? encodeURIComponent(targetKey) : "";
        document.querySelectorAll('.article-star-btn').forEach(button => {
            if (!targetEncoded || button.dataset.key === targetEncoded) {
                const key = decodeURIComponent(button.dataset.key || "");
                setStarButtonState(button, key);
            }
        });
    }

    function toggleBookmarkForKey(key) {
        if (!key || !(key in constitutionData)) return;

        if (bookmarks.includes(key)) {
            bookmarks = bookmarks.filter(b => b !== key);
        } else {
            bookmarks.push(key);
        }

        localStorage.setItem('bookmarks_2026', JSON.stringify(bookmarks));
        updateCounter();
        updateBookmarkButton();
    }

    function renderContent(data) {
        const content = document.getElementById('content');
        const keys = Object.keys(data);

        if (!keys.length) {
            content.innerHTML = '<div class="empty-state">No articles match your search.</div>';
            return;
        }

        content.innerHTML = keys.map(key => {
            const isSaved = bookmarks.includes(key);
            const label = isSaved ? `Remove bookmark for ${key}` : `Bookmark ${key}`;
            return `
            <article class="article-card ${key === activeKey ? 'active' : ''}" id="${keyToId(key)}">
                <div class="article-card-header">
                    <h3>${escapeHtml(key)}</h3>
                    <button type="button" class="article-star-btn ${isSaved ? 'active' : ''}" data-key="${encodeURIComponent(key)}" title="${escapeHtml(label)}" aria-label="${escapeHtml(label)}">
                        <i class="fa-${isSaved ? 'solid' : 'regular'} fa-star"></i>
                    </button>
                </div>
                <p>${escapeHtml(data[key])}</p>
            </article>
        `;
        }).join('');

        content.querySelectorAll('.article-star-btn').forEach(button => {
            button.addEventListener('click', (event) => {
                event.preventDefault();
                event.stopPropagation();
                const key = decodeURIComponent(button.dataset.key || "");
                toggleBookmarkForKey(key);
                setStarButtonState(button, key);
            });
        });

        syncArticleStarButtons();
    }

    function updateTitle(data) {
        document.getElementById('title').innerText = `All Articles (${Object.keys(data).length})`;
    }

    function renderList(data) {
        const container = document.getElementById('articleList');
        container.innerHTML = "";
        Object.keys(data).forEach(key => {
            const div = document.createElement('div');
            div.className = `nav-item ${key === activeKey ? 'active' : ''}`;
            div.innerHTML = `<span>${key}</span><i class="fa-solid fa-chevron-right"></i>`;
            div.dataset.key = key;
            div.onclick = () => selectArticle(key);
            container.appendChild(div);
        });
    }

    function selectArticle(key) {
        activeKey = key;

        document.querySelectorAll('.nav-item').forEach(el => {
            el.classList.toggle('active', el.dataset.key === key);
        });

        document.querySelectorAll('.article-card').forEach(card => {
            card.classList.toggle('active', card.id === keyToId(key));
        });

        const target = document.getElementById(keyToId(key));
        if (target) {
            target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        updateBookmarkButton();
    }

    function doSearch() {
        const query = document.getElementById('searchBar').value.toLowerCase();
        const filtered = {};
        Object.keys(constitutionData).forEach(key => {
            if (key.toLowerCase().includes(query) || constitutionData[key].toLowerCase().includes(query)) {
                filtered[key] = constitutionData[key];
            }
        });
        if (activeKey && !filtered[activeKey]) {
            activeKey = "";
        }
        renderList(filtered);
        renderContent(filtered);
        updateTitle(filtered);
        updateBookmarkButton();
    }

    function toggleBookmark() {
        if (!activeKey) return;
        toggleBookmarkForKey(activeKey);
        syncArticleStarButtons(activeKey);
    }

    function updateCounter() {
        document.getElementById('count').innerText = bookmarks.length;
    }

    function showBookmarks() {
        const list = document.getElementById('bookmarkList');
        list.innerHTML = bookmarks.length ? "" : "No saved articles.";
        bookmarks.forEach(b => {
            const d = document.createElement('div');
            d.className = "modal-item";
            d.innerText = b;
            d.onclick = () => {
                document.getElementById('searchBar').value = "";
                doSearch();
                selectArticle(b);
                closeModal();
            };
            list.appendChild(d);
        });
        document.getElementById('modal').style.display = "block";
    }

    function closeModal() { document.getElementById('modal').style.display = "none"; }

    // Init
    renderList(constitutionData);
    renderContent(constitutionData);
    updateTitle(constitutionData);
    updateBookmarkButton();
    updateCounter();
    applySidebarState();
</script>
