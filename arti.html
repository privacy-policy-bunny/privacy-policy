<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Constitution Audit 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --sidebar-bg: #1e293b;
            --accent: #38bdf8;
            --text-main: #f1f5f9;
            --text-dim: #94a3b8;
            --card-bg: #1e293b;
            --border: #334155;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar - Always Open */
        .sidebar {
            width: 350px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow: hidden;
            transition: width 0.25s ease, border-color 0.25s ease;
        }

        .sidebar-collapsed .sidebar {
            width: 0;
            border-right-color: transparent;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-header h2 {
            margin: 0 0 15px 0;
            font-size: 1.2rem;
            color: var(--accent);
        }

        .search-box {
            position: relative;
        }

        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
        }

        #searchBar {
            width: 100%;
            padding: 10px 10px 10px 35px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: #0f172a;
            color: white;
            box-sizing: border-box;
            outline: none;
        }

        .article-list {
            overflow-y: auto;
            flex-grow: 1;
        }

        .nav-item {
            padding: 12px 20px;
            cursor: pointer;
            border-bottom: 1px solid rgba(51, 65, 85, 0.2);
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-item:hover { background: #334155; }
        .nav-item.active { background: #0ea5e920; border-left: 4px solid var(--accent); color: var(--accent); }

        /* Content Area */
        .content-area {
            flex-grow: 1;
            padding: 40px;
            overflow-y: auto;
            display: flex;
            justify-content: center;
        }

        .wrapper { max-width: 800px; width: 100%; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        h1 { margin: 0; font-size: 2rem; }

        .btn-group { display: flex; gap: 10px; }

        button {
            background: var(--sidebar-bg);
            border: 1px solid var(--border);
            color: white;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover { border-color: var(--accent); }
        #bookmarkBtn.active { color: #fbbf24; border-color: #fbbf24; }

        .icon-btn {
            width: 40px;
            height: 40px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .list-view {
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding-bottom: 20px;
        }

        .article-card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            border: 1px solid var(--border);
            line-height: 1.7;
            font-size: 1.02rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            scroll-margin-top: 20px;
        }

        .article-card h3 {
            margin: 0 0 10px 0;
            color: var(--accent);
            font-size: 1.2rem;
            text-transform: capitalize;
        }

        .article-card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px;
        }

        .article-card-header h3 {
            margin: 0;
            flex: 1;
        }

        .article-star-btn {
            width: 34px;
            height: 34px;
            padding: 0;
            border-radius: 8px;
            background: #0f172a;
            color: var(--text-dim);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .article-star-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .article-star-btn.active {
            border-color: #fbbf24;
            color: #fbbf24;
        }

        .article-card p {
            margin: 0;
            white-space: pre-wrap;
        }

        .article-card.active {
            border-color: var(--accent);
            box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.4);
        }

        .empty-state {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            color: var(--text-dim);
        }

        /* Modal */
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); }
        .modal-content { background: var(--sidebar-bg); margin: 10% auto; padding: 25px; width: 400px; border-radius: 12px; }
        .modal-item { padding: 10px; border-bottom: 1px solid var(--border); cursor: pointer; }
        .modal-item:hover { color: var(--accent); }
    </style>
</head>
<body>

<aside class="sidebar">
    <div class="sidebar-header">
        <h2>Audit Dashboard</h2>
        <div class="search-box">
            <i class="fa-solid fa-search"></i>
            <input type="text" id="searchBar" placeholder="Search..." onkeyup="doSearch()">
        </div>
    </div>
    <div class="article-list" id="articleList"></div>
</aside>

<main class="content-area">
    <div class="wrapper">
        <header>
            <div class="header-left">
                <button id="sidebarToggle" class="icon-btn" onclick="toggleSidebar()" title="Hide sidebar">
                    <i id="sidebarToggleIcon" class="fa-solid fa-angles-left"></i>
                </button>
                <h1 id="title">All Articles</h1>
            </div>
            <div class="btn-group">
                <button id="bookmarkBtn" onclick="toggleBookmark()"><i class="fa-star fa-regular"></i></button>
                <button onclick="showBookmarks()">Bookmarks (<span id="count">0</span>)</button>
            </div>
        </header>
        <div class="list-view" id="content"></div>
    </div>
</main>

<div id="modal" class="modal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h3>Saved Articles</h3>
        <div id="bookmarkList"></div>
        <button onclick="closeModal()" style="margin-top: 20px; width: 100%;">Close</button>
    </div>
</div>

<script>
    // THE DATA: Simple key-value list
    const constitutionData = {
  "article 1": "India (Bharat) is a 'Union of States' implying an indestructible union where states cannot secede, States and Union Territories are specified in the First Schedule, Territory of India comprises territories of States/Union Territories and any territories acquired by the Government of India at any time",
  "article 2": "Parliament may by law admit or establish new States on terms it thinks fit, Specifically relates to the admission of territories not already part of the Union of India, Note: Article 2A (Associate status for Sikkim) was inserted and subsequently repealed by the 36th Amendment when Sikkim became a full State",
  "article 3": "Parliament can form new States/Union Territories by separating territory or uniting parts, Parliament can increase/diminish area or alter boundaries/names of any State, Procedure: Bill requires President's prior recommendation, President must refer the Bill to the affected State Legislature for views within a specified time limit, State Legislature views are NOT binding, Explanation I: For boundary changes 'State' includes Union Territory but for the reference proviso 'State' does NOT include Union Territory (UTs don't need to be consulted), Explanation II: Parliament can unite a part of a State/UT to any other State/UT",
  "article 4": "Laws made under Articles 2 and 3 must provide for amendments to the First and Fourth Schedules (representation in Rajya Sabha), Parliament can include supplemental/incidental/consequential provisions, These laws are NOT considered amendments under Article 368 and can be passed by a simple majority",
  "article 5": "Citizenship at the commencement (Jan 26 1950) for persons domiciled in India, Must meet one condition: Born in India / Either parent born in India / Ordinarily resident for at least 5 years immediately preceding commencement",
  "article 6": "Citizenship for migrants from Pakistan to India, Person (or parents/grandparents) must be born in Undivided India (as defined in GOI Act 1935), If migrated before July 19 1948: citizen if ordinarily resident since migration, If migrated on/after July 19 1948: must reside for 6 months and be registered by an authorized officer",
  "article 7": "Migrants to Pakistan after March 1 1947 lose Indian citizenship, Exception: If returning under a permit for resettlement or permanent return they can become citizens by following the same registration process as post-July 19 1948 migrants",
  "article 8": "Citizenship for Persons of Indian Origin (PIOs) residing outside India (excluding Pakistan), Person (or parents/grandparents) must be born in Undivided India, Must be registered by the diplomatic or consular representative of India in the country of residence",
  "article 9": "No person shall be a citizen of India if they have voluntarily acquired the citizenship of any foreign State, Indian Constitution prohibits dual citizenship",
  "article 10": "Every person deemed a citizen under Articles 5 to 9 continues to be a citizen, This right is 'permanent' but subject to any future laws made by Parliament",
  "article 11": "Parliament is empowered beyond Articles 5 to 10 to regulate citizenship by law; it has plenary power over acquisition, termination and all related citizenship matters, exercised primarily through the Citizenship Act, 1955 (as amended).",
  "article 12": "Definition of 'The State' for Part III ('In this Part'): includes Government and Parliament of India, Government and Legislature of each State, all local authorities (municipalities/panchayats), and other authorities within the territory of India or under the control of the Government of India.",
  "article 13": "Judicial review clause for Fundamental Rights: (1) pre-Constitution laws inconsistent with FR are void to the extent of inconsistency (Doctrine of Eclipse), (2) the State shall not make laws taking away or abridging FR and contravening law is void to the extent of contravention (Doctrine of Severability), (3) 'law' includes ordinances/orders/bye-laws/rules/regulations/notifications/customs/usages, (4) inserted by the 24th Amendment: Article 13 does not apply to Constitutional Amendments under Article 368.",
  "article 14": "Equality before the law and equal protection of the laws; applies to 'any person' (citizens, non-citizens, and juristic persons/corporations), permits reasonable classification (intelligible differentia + rational nexus), and prohibits arbitrariness.",
  "article 15": "Applies only to citizens: prohibition of discrimination ONLY on grounds of religion/race/caste/sex/place of birth, including access to shops/public restaurants/hotels and places of public resort; exceptions allow special provisions for women/children (15(3)), socially and educationally backward classes/SC/ST (15(4)), admission to educational institutions including private unaided except minority institutions (15(5)), and EWS (15(6)).",
  "article 16": "Applies only to citizens: equality of opportunity in public employment; no discrimination ONLY on religion/race/caste/sex/descent/place of birth/residence; key exceptions include residence requirement by Parliament for specific posts (16(3)), reservation for backward classes (16(4)), reservation in promotion for SC/ST (16(4A)), carry-forward of unfilled reserved vacancies (16(4B)), religious-office exception (16(5)), and EWS reservation (16(6)).",
  "article 17": "Abolition of 'Untouchability' and prohibition of its practice in any form; enforcement of disability arising from it is a punishable offence; absolute right enforceable against both State and private persons, implemented through statutes such as the Protection of Civil Rights Act, 1955 and SC/ST (Prevention of Atrocities) Act, 1989.",
  "article 18": "Abolition of titles: the State shall not confer titles except military or academic distinctions; no citizen shall accept any title from a foreign State; no person holding office of profit or trust under the State shall accept any present/emolument/office/title from a foreign State without President's consent; National Awards (Bharat Ratna/Padma) are valid but cannot be used as titles (prefix/suffix).",
  "article 19": "Available only to citizens: six freedoms under Article 19(1) are (a) speech/expression, (b) peaceful assembly, (c) associations/unions/co-operative societies (co-operatives added by 97th Amendment), (d) movement, (e) residence/settlement, (g) profession/trade/business; Article 19(1)(f) right to property was deleted by the 44th Amendment (now Article 300A). Restrictions are clause-specific: (2) speech, (3) assembly, (4) association, (5) movement/residence, (6) profession including technical qualifications and State monopoly.",
  "article 20": "Protection in respect of conviction for offences (applies to all persons, citizens and non-citizens): (1) No ex post facto criminal law (no retrospective conviction or enhanced penalty), (2) No double jeopardy (no person prosecuted and punished for the same offence more than once), (3) No self-incrimination (no accused compelled to be a witness against himself); these safeguards operate in criminal proceedings, not civil/departmental actions.",
  "article 21": "No person shall be deprived of life or personal liberty except according to procedure established by law; after Maneka Gandhi, procedure must be just, fair and reasonable (substantive due process reading). Applies to citizens and non-citizens, includes rights flowing from dignity (privacy, legal aid, speedy trial, clean environment etc.), and together with Article 20 remains non-suspendable in enforcement even during Emergency (Art 359 proviso, 44th Amendment).",
  "article 21A": "State shall provide free and compulsory education to all children of 6-14 years in such manner as the State may by law determine; inserted by 86th Amendment Act, 2002 and operationalized mainly through the Right of Children to Free and Compulsory Education Act, 2009; covers elementary stage only (not pre-school/higher/professional education).",
  "article 22": "Protection against arrest and detention: for ordinary arrest, rights include being informed of grounds, consulting/being defended by lawyer of choice, and production before Magistrate within 24 hours excluding journey time; no detention beyond 24 hours without Magistrate's authority. Clauses (1)-(2) do NOT apply to enemy aliens and preventive detention cases. Preventive detention safeguards: communicate grounds as soon as may be, earliest opportunity to make representation, and no detention beyond 3 months unless Advisory Board reports sufficient cause (with Parliament empowered to prescribe further law).",
  "article 23": "Prohibits traffic in human beings, begar and other similar forms of forced labour; contravention is punishable by law; applies against both State and private persons and protects citizens and non-citizens. Exception: State may impose compulsory service for public purposes, but without discrimination ONLY on religion/race/caste/class or any of them.",
  "article 24": "Prohibits employment of children below 14 years in any factory, mine or hazardous employment; this is an absolute constitutional bar for hazardous sectors. UPSC trap: Constitution text does not prohibit all child work, only the specified categories (ordinary/non-hazardous work is governed by statutory law).",
  "article 25": "All persons are equally entitled to freedom of conscience and to profess, practice and propagate religion, subject to public order, morality, health and other Fundamental Rights. State may regulate/restrict secular (economic, financial, political) activities associated with religion and may enact social welfare/reform laws including opening Hindu religious institutions to all classes/sections; Explanation I recognizes carrying of kirpan as part of Sikh profession of religion; Explanation II: reference to Hindus includes Sikhs, Jains and Buddhists for clause (2)(b).",
  "article 26": "Every religious denomination or any section thereof has (collective right) to establish and maintain institutions for religious and charitable purposes, manage its own affairs in matters of religion, own/acquire property, and administer such property in accordance with law; subject to public order, morality and health.",
  "article 27": "No person can be compelled to pay taxes, proceeds of which are specifically appropriated for payment of expenses for promotion or maintenance of any particular religion or religious denomination; exam distinction: regulatory/service fee is permissible, but tax for religious promotion is barred.",
  "article 28": "Religious instruction in educational institutions: (1) wholly State-maintained institutions - prohibited; (2) State-administered institutions established under endowment/trust requiring such instruction - permitted; (3) institutions recognized by the State or receiving State aid - no person can be compelled to attend religious instruction/worship without consent (or guardian consent for minors).",
  "article 29": "Cultural and educational rights: Article 29(1) protects the right of any section of citizens (not only minorities) having distinct language, script or culture to conserve it. Article 29(2) bars denial of admission into State-maintained or State-aided educational institutions ONLY on religion, race, caste, language or any of them (UPSC trap: 'sex' and 'place of birth' are not in 29(2)).",
  "article 30": "All minorities, whether based on religion or language, have the right to establish and administer educational institutions of their choice; minority status is assessed with reference to the State for this purpose. Article 30(1A): on compulsory acquisition of minority institution property, compensation amount must not restrict or abrogate this right. Article 30(2): State shall not discriminate in grant of aid on the ground that an institution is under minority management.",
  "article 31": "Right to property was removed from Fundamental Rights by the 44th Amendment Act, 1978 (Article 31 repealed); it now survives as a constitutional/legal right under Article 300A ('no person shall be deprived of his property save by authority of law'), so it is enforceable but not as a Part III Fundamental Right.",
  "article 31A": "Saving of laws for acquisition of estates and certain specified categories from challenge under Articles 14 and 19 (land reform shield): covers acquisition of estates/rights, takeover of management of property, amalgamation of corporations, modification of rights of directors/shareholders/managers, and modification/termination of mining or mineral-oil agreements. Key proviso: where a State law under 31A is reserved for President and receives assent, the protection operates; exam trap - it is not a blanket immunity for every law touching property.",
  "article 31B": "Validation of laws in the Ninth Schedule: Acts/Regulations placed in the Ninth Schedule are immunized from invalidation for contravention of FR, but post-Kesavananda insertion (after 24 April 1973) is open to judicial review on Basic Structure grounds (I.R. Coelho, 2007).",
  "article 31C": "Saving of laws giving effect to Directive Principles in Article 39(b) and 39(c): such laws get protection against challenge under Articles 14 and 19, but courts can still examine whether there is real nexus with 39(b)/(c). The 42nd Amendment extension of this shield to all DPSPs was struck down in Minerva Mills (1980); present position remains limited to 39(b) and 39(c).",
  "article 32": "Right to Constitutional Remedies (itself a Fundamental Right): individuals can directly move the Supreme Court for enforcement of Part III rights; Supreme Court may issue writs (Habeas Corpus, Mandamus, Prohibition, Certiorari, Quo-Warranto). Jurisdiction is original but not exclusive (High Courts also under Art 226); only the Constitution may provide suspension/limitation of this enforcement route.",
  "article 33": "Parliament (and only Parliament) may by law determine the extent to which FR apply to members of Armed Forces, forces charged with maintenance of public order, intelligence/counter-intelligence organizations, and connected telecom personnel, so as to ensure proper discharge of duties and maintenance of discipline.",
  "article 34": "Restriction on rights while Martial Law is in force in any area: Parliament may by law indemnify persons for acts done to maintain/restore order and may validate related punishments/forfeitures/sentences; Martial Law is distinct from National Emergency and is not separately defined in the Constitution.",
  "article 35": "Legislation to give effect to certain Part III provisions: Parliament has exclusive power to make laws on residence requirements for employment (Art 16(3)), conferring writ powers on courts other than SC (Art 32(3)), FR restrictions for disciplined forces (Art 33), indemnity during Martial Law (Art 34), and prescribing punishment for offences under Arts 17 and 23; States cannot legislate on these matters.",
  "article 36": "Definition clause for Part IV (DPSP): 'State' has the same meaning as in Article 12.",
  "article 37": "Application of DPSPs: they are non-justiciable (not enforceable by courts), yet fundamental in governance of the country, and it is the duty of the State to apply these principles in making laws.",
  "article 38": "State to secure a social order for welfare of the people: promote social, economic and political justice; Article 38(2) (added by 44th Amendment) directs minimization of inequalities in income, status, facilities and opportunities not only among individuals but also among groups/regions.",
  "article 39": "Directive policy principles: (a) adequate means of livelihood for men and women, (b) ownership/control of material resources distributed to subserve common good, (c) operation of economic system should not concentrate wealth/means of production to common detriment, (d) equal pay for equal work, (e) protection of workers' health/strength and children from abuse, (f) children to develop in freedom/dignity and be protected against exploitation and moral/material abandonment.",
  "article 39A": "Equal justice and free legal aid (added by 42nd Amendment, 1976): State shall secure operation of legal system promoting justice on basis of equal opportunity and provide free legal aid so justice is not denied due to economic or other disabilities.",
  "article 40": "Organization of village panchayats: State shall take steps to organize village panchayats and endow them with powers/authority necessary to function as units of self-government (Gandhian principle; later institutionally strengthened by the 73rd Constitutional Amendment).",
  "article 41": "Right to work, to education, and to public assistance in certain cases: State shall within its economic capacity provide for the right to work, education, and assistance in cases of unemployment, old age, sickness, and disablement (Socialistic Principle)",
  "article 42": "Provision for just and humane conditions of work and maternity relief: State shall make provisions for securing humane work environments and providing for maternity benefits for women workers",
  "article 43": "Living wage, etc., for workers: State shall strive to secure a living wage, conditions of work ensuring a decent standard of life, and full enjoyment of leisure and social/cultural opportunities, Includes promotion of cottage industries in rural areas (Gandhian Principle)",
  "article 43A": "Participation of workers in management of industries: State shall take steps to secure the participation of workers in the management of undertakings/establishments engaged in any industry, Added by the 42nd Amendment Act 1976",
  "article 43B": "Promotion of co-operative societies: State shall strive to promote voluntary formation, autonomous functioning, democratic control, and professional management of co-operative societies, Added by the 97th Amendment Act 2011",
  "article 44": "Uniform Civil Code for the citizens: State shall endeavor to secure for the citizens a Uniform Civil Code throughout the territory of India (Liberal-Intellectual Principle)",
  "article 45": "Provision for early childhood care and education to children below the age of six years: Substituted by the 86th Amendment Act 2002 (Previously covered ages 6-14 which moved to Fundamental Rights under Art 21A)",
  "article 46": "Promotion of educational and economic interests of Scheduled Castes, Scheduled Tribes, and other weaker sections: State shall protect them from social injustice and all forms of exploitation",
  "article 47": "Duty of the State to raise the level of nutrition and the standard of living and to improve public health: Includes the endeavor to bring about prohibition of the consumption of intoxicating drinks and drugs which are injurious to health (except for medicinal purposes)",
  "article 48": "Organisation of agriculture and animal husbandry: State shall organize these on modern and scientific lines and, in particular, take steps for preserving/improving breeds and prohibiting the slaughter of cows, calves, and other milch/draught cattle",
  "article 48A": "Protection and improvement of environment and safeguarding of forests and wild life: Added by the 42nd Amendment Act 1976, Mandates the State to protect and improve the natural environment",
  "article 49": "Protection of monuments and places and objects of national importance: State is obligated to protect every monument or place of artistic or historic interest declared by Parliament to be of national importance from spoliation/destruction/removal",
  "article 50": "Separation of judiciary from executive: State shall take steps to separate the judiciary from the executive in the public services of the State to ensure judicial independence",
  "article 51": "Promotion of international peace and security: State shall strive to (a) promote international peace/security, (b) maintain just and honourable relations between nations, (c) foster respect for international law and treaty obligations, (d) encourage settlement of international disputes by arbitration",
  "article 51A": "Fundamental Duties: Originally 10 duties added by 42nd Amendment 1976 (Swaran Singh Committee), 11th duty (education for 6-14 years) added by 86th Amendment 2002, Duties are non-justiciable but enforceable by law through specific statutes",
  "article 52": "The President of India: mandatory constitutional office ('There shall be a President of India'); the Union executive cannot exist without this office.",
  "article 53": "Executive power of the Union is vested in the President and exercised either directly or through officers subordinate to him in accordance with the Constitution; Supreme Command of the Defence Forces is also vested in the President, but its exercise is regulated by law (civilian/parliamentary control).",
  "article 54": "Election of President: by an Electoral College consisting of (i) elected members of both Houses of Parliament, (ii) elected members of Legislative Assemblies of States, and (iii) elected members of Legislative Assemblies of NCT Delhi and Puducherry (70th Amendment). Nominated MPs/MLAs and members of State Legislative Councils are excluded.",
  "article 55": "Manner of election: proportional representation by means of single transferable vote (STV) and secret ballot. It seeks uniformity among States and parity between Union and States via vote-value formula: MLA vote value depends on State population and elected Assembly strength; MP vote value is derived from total MLA vote value divided by total elected MPs of both Houses. For this calculation, population is based on the 1971 Census until figures of the first Census after 2026 are published.",
  "article 56": "Term of office: 5 years from date of entering office; resignation is addressed to the Vice-President (who must communicate it to the Speaker of Lok Sabha); removal only by impeachment under Article 61; President continues in office beyond term until successor enters upon office.",
  "article 57": "Eligibility for re-election: a person who has held office as President is eligible for re-election; no constitutional term limit on number of times.",
  "article 58": "Qualifications for election as President: (1) citizen of India, (2) completed 35 years of age, (3) qualified for election as a member of Lok Sabha, (4) does not hold any office of profit under Union/State government or local/other authority under their control. Exception: sitting President, Vice-President, Governor, and Union/State Ministers are not deemed office-of-profit holders for this purpose.",
  "article 59": "Conditions of office: President shall not be a member of either House of Parliament or of a State Legislature (seat deemed vacated on entering office); shall not hold any other office of profit; is entitled without payment of rent to official residences and to emoluments/allowances/privileges as determined by Parliament (or, until so determined, as in Second Schedule); emoluments and allowances cannot be diminished during term.",
  "article 60": "Oath or affirmation of President: administered by the Chief Justice of India (or in his absence the senior-most available Supreme Court judge); President swears to faithfully execute office and to preserve, protect and defend the Constitution and the law, and devote himself to service and well-being of the people of India.",
  "article 61": "Impeachment of President: only ground is 'violation of the Constitution' (undefined). Charge can originate in either House after at least 14 days' written notice signed by at least one-fourth of the total membership of that House; the initiating House must pass the resolution by a majority of not less than two-thirds of total membership; the other House investigates (or causes investigation), the President has right to appear and be represented; removal occurs only if the second House also passes by two-thirds of total membership.",
  "article 62": "Time of election of President: election to fill vacancy caused by expiry of term must be completed before term ends; election for vacancy by death/resignation/removal/other cause must be held within 6 months; person elected in a casual vacancy holds office for a full 5-year term from date of entering office (not merely remainder).",
  "article 63": "There shall be a Vice-President of India: mandatory constitutional office, who ranks next after the President in the Union executive order of precedence.",
  "article 64": "Vice-President is ex officio Chairman of Rajya Sabha and cannot hold any other office of profit; during period when he acts as President (Art 65), he does not perform duties of Chairman and is not entitled to Chairman's salary/allowances for that period.",
  "article 65": "Vice-President acts as President on occurrence of vacancy in office of President (death/resignation/removal/otherwise) until new President enters office, and discharges President's functions when President is unable to do so (absence/illness/other cause); while so acting/discharging, he has all powers, immunities and emoluments of President.",
  "article 66": "Election of Vice-President: by members of an Electoral College consisting of members of both Houses of Parliament (elected and nominated, both included); State Legislatures have no role. Election method is proportional representation by means of single transferable vote and secret ballot. Qualification link: person must be qualified for election as a member of Rajya Sabha; office-of-profit bar applies with constitutional exceptions.",
  "article 67": "Term/removal/resignation of Vice-President: term is 5 years from entering office; resignation is addressed to the President. Removal is by Rajya Sabha resolution passed by majority of all the then members (effective majority) and agreed to by Lok Sabha; at least 14 days' notice is mandatory; Constitution does not specify grounds for removal.",
  "article 68": "Time of election for Vice-President vacancy: election to fill vacancy from expiry of term must be completed before expiry; election for casual vacancy (death/resignation/removal/otherwise) shall be held as soon as possible; person elected to casual vacancy is entitled to full 5-year term from date of entering office.",
  "article 69": "Oath or affirmation of Vice-President: before entering office, oath in Third Schedule form is made before the President or a person appointed by him; wording centers on true faith and allegiance to the Constitution and faithful discharge of duty.",
  "article 70": "Discharge of President's functions in other contingencies: Parliament may make provision for situations not otherwise provided in Chapter I, Part V (for example, statutory arrangement under the President (Discharge of Functions) Act, 1969 when both President and Vice-President offices/functions are unavailable).",
  "article 71": "Matters relating to election of President/Vice-President: all doubts and disputes are inquired into and decided only by the Supreme Court, whose decision is final; if election is declared void, acts done before that decision remain valid; Parliament may regulate connected matters by law (e.g., Presidential and Vice-Presidential Elections Act, 1952), and election cannot be questioned merely due to a vacancy in the electoral college.",
  "article 72": "President's pardoning power: can grant pardon, reprieve, respite, remission, or commutation in (i) all cases where punishment/sentence is by Court Martial, (ii) all cases where offence is against a law on a matter to which Union executive power extends, and (iii) all death-sentence cases. UPSC trap: President can pardon death sentence and Court Martial cases; power is exercised on aid and advice of Council of Ministers.",
  "article 73": "Extent of Union executive power: extends to matters on which Parliament has power to make laws and to exercise rights/authority/jurisdiction exercisable by Government of India by treaty or agreement; proviso for Concurrent List matters - Union executive power does not, save as expressly provided in Constitution or by Parliamentary law, extend in a State to matters where State Legislature also has power.",
  "article 74": "Council of Ministers to aid and advise President: there shall be a CoM with Prime Minister at the head; President shall act in accordance with such advice (42nd Amendment), but may once require reconsideration; after reconsideration, President is bound by that advice (44th Amendment). Clause (2): courts cannot inquire into what advice was tendered by Ministers to President.",
  "article 75": "Other provisions on Union Ministers: Prime Minister appointed by President, other Ministers appointed by President on PM's advice; Ministers hold office during pleasure of President; CoM is collectively responsible to Lok Sabha; Minister must take oath of office and secrecy before entering office (Third Schedule); non-member can be Minister only for 6 consecutive months; salaries/allowances as Parliament determines. 91st Amendment: total number of Ministers including PM cannot exceed 15% of Lok Sabha strength, and a member disqualified under Tenth Schedule is also disqualified from being appointed as Minister during the disqualification period.",
  "article 76": "Attorney-General for India: appointed by President and must be qualified to be a Supreme Court judge; duty is to advise Government of India on legal matters and perform legal duties assigned by President, and to discharge constitutional/legal functions; has right of audience in all courts in India; holds office during President's pleasure and receives remuneration as determined by President.",
  "article 77": "Conduct of business of Government of India: all executive action must be expressed in the name of the President; orders/instruments are authenticated in the prescribed manner and validity cannot be questioned for non-execution by President personally; President makes rules for convenient transaction of business and allocation among Ministers (Transaction/Allocation of Business Rules).",
  "article 78": "Duties of Prime Minister toward President: (a) communicate to President all decisions of CoM relating to administration and legislative proposals, (b) furnish information as President may call for, (c) submit for CoM consideration any matter decided by a Minister but not considered by CoM, when President so requires.",
  "article 79": "Constitution of Parliament: Parliament of the Union consists of the President and two Houses - Council of States (Rajya Sabha) and House of the People (Lok Sabha).",
  "article 80": "Composition of Rajya Sabha (Council of States): maximum strength 250, comprising 12 members nominated by President for special knowledge/practical experience in literature, science, art and social service, and not more than 238 representatives of States and Union Territories; representatives of States are elected by elected MLAs through proportional representation by single transferable vote, while UT representation is as Parliament prescribes by law; seat allocation is in the Fourth Schedule.",
  "article 81": "Composition of Lok Sabha (House of the People): not more than 530 members chosen by direct election from territorial constituencies in States and not more than 20 to represent Union Territories (total ceiling 550 under this Article). Seats are allocated so that the population-to-seat ratio is, as far as practicable, uniform across States and constituencies within a State. Anglo-Indian nomination to Lok Sabha has been omitted by the 104th Amendment (2019).",
  "article 82": "Readjustment after each Census: after every Census completion, allocation of seats to States in Lok Sabha and division of each State into territorial constituencies shall be readjusted by authority and in manner provided by Parliamentary law (Delimitation framework). Such readjustment takes effect from date specified by President and does not affect representation in existing Lok Sabha until dissolution. Freeze nuance: seat readjustment is deferred until the first Census after 2026 (as per amendment scheme).",
  "article 83": "Duration of Houses of Parliament: Rajya Sabha is a permanent body and not subject to dissolution; as nearly as possible, one-third members retire every second year. Lok Sabha continues for 5 years from date appointed for first meeting unless dissolved sooner. During National Emergency, Parliament may extend Lok Sabha by law for one year at a time, but not beyond 6 months after Emergency ceases.",
  "article 84": "Qualification for membership of Parliament: person must be citizen of India, make/subcribe oath or affirmation in Third Schedule form before person authorized by Election Commission, be at least 30 years for Rajya Sabha and 25 years for Lok Sabha, and possess additional qualifications prescribed by Parliament (primarily Representation of the People Act).",
  "article 85": "Sessions/prorogation/dissolution: President summons each House at such time and place as he thinks fit, but 6 months shall not intervene between the last sitting of one session and first sitting of next session; President may prorogue either House and dissolve Lok Sabha. Adjournment is by presiding officer (not President). Bills do not lapse on prorogation; dissolution affects pending business in Lok Sabha as per constitutional rules.",
  "article 86": "Right of President to address and send messages: President may address either House or both Houses assembled together and may require attendance of members for that purpose; President may also send messages to either House regarding a Bill pending or otherwise, and the House shall consider such message with all convenient dispatch.",
  "article 87": "Special Address by President: at commencement of first session after each general election to Lok Sabha and at commencement of first session each year, President addresses both Houses assembled together and informs Parliament of causes of summons. Each House discusses matters referred in the Address (Motion of Thanks convention).",
  "article 88": "Rights of Ministers and Attorney-General in Parliament: every Minister and the Attorney-General have right to speak and otherwise take part in proceedings of either House, joint sitting, and any committee of Parliament of which they may be named a member; however, they have no right to vote unless they are members of that House.",
  "article 89": "Chairman and Deputy Chairman of Rajya Sabha: Vice-President of India is ex officio Chairman of the Council of States; Rajya Sabha shall, as soon as may be, choose one of its members to be Deputy Chairman (and when office is vacant, choose another member).",
  "article 90": "Vacation/resignation/removal of Deputy Chairman: Deputy Chairman vacates office if he ceases to be a Rajya Sabha member; may resign by writing under hand addressed to Chairman; may be removed by a resolution of Rajya Sabha passed by a majority of all the then members, provided at least 14 days' notice of intention to move the resolution is given.",
  "article 91": "Power of Deputy Chairman or other person to perform duties of Chairman (Rajya Sabha): when office of Chairman is vacant, or Vice-President is acting/discharging President's functions, Deputy Chairman performs Chairman's duties; if Deputy Chairman office is also vacant, President may appoint a Rajya Sabha member to perform duties. During absence of Chairman and Deputy Chairman from a sitting, person determined by rules (or by House) presides.",
  "article 92": "Chairman/Deputy Chairman not to preside while removal resolution is under consideration: the concerned presiding officer cannot chair that sitting even if present. Chairman has right to speak and participate on his own removal resolution but cannot vote at all (despite Article 100). Deputy Chairman on his own removal can speak/participate and vote in first instance as member, but no casting vote (since he is not presiding).",
  "article 93": "Speaker and Deputy Speaker of Lok Sabha: House of the People shall, as soon as may be, choose two members as Speaker and Deputy Speaker; when either office becomes vacant, the House shall choose another member.",
  "article 94": "Vacation/resignation/removal of Speaker or Deputy Speaker: office vacates if the person ceases to be a Lok Sabha member; Speaker may resign to Deputy Speaker and Deputy Speaker may resign to Speaker; removal is by Lok Sabha resolution passed by majority of all the then members with at least 14 days' notice. Proviso trap: on dissolution of Lok Sabha, only the Speaker continues until immediately before first meeting of the new Lok Sabha.",
  "article 95": "Power of Deputy Speaker or other person to perform duties of Speaker: when Speaker's office is vacant, Deputy Speaker acts as Speaker; if Deputy Speaker office is also vacant, President appoints a Lok Sabha member for duties of Speaker. During absence of Speaker and Deputy Speaker from a sitting, person determined by rules (or by House) presides; person so presiding has powers of Speaker for that sitting.",
  "article 96": "Speaker/Deputy Speaker not to preside during consideration of removal resolution against them. Speaker has right to speak and participate during his own removal proceedings and, notwithstanding Article 100, may vote only in first instance (no casting vote). For Deputy Speaker's removal proceedings, he cannot preside and votes only as ordinary member, not as casting authority.",
  "article 97": "Salaries and allowances of Chairman/Deputy Chairman (Rajya Sabha) and Speaker/Deputy Speaker (Lok Sabha) are as determined by Parliament by law and, until then, as in Second Schedule; these are charged on the Consolidated Fund of India (non-votable expenditure).",
  "article 98": "Parliament Secretariat: each House has separate secretarial staff; Parliament may by law regulate recruitment and service conditions. Until such law, President may make rules after consulting Chairman/Speaker; provisions may allow creation of posts common to both Houses.",
  "article 99": "Oath or affirmation by members: every member of either House must, before taking seat, make/subcribe oath or affirmation in Third Schedule form before President or person appointed by him; without oath, member cannot sit or vote.",
  "article 100": "Voting in Houses and joint sittings: all questions are decided by majority of members present and voting, subject to Constitution. Speaker/Chairman/person acting as such does not vote in first instance but has casting vote in case of tie. Quorum is one-tenth of total membership of the House; if quorum lacking, presiding officer must adjourn or suspend until quorum is met. House can act notwithstanding vacancies, and proceedings remain valid even if later found that an unauthorized person sat/voted/participated.",
  "article 101": "Vacation of seats: no person can be member of both Houses of Parliament simultaneously, or of Parliament and a State Legislature simultaneously (vacancy handled per Parliamentary law). If member is absent from all meetings of a House for 60 days without permission, the House may declare the seat vacant; while counting 60 days, periods when House is prorogued or adjourned for more than 4 consecutive days are excluded. Resignation of seat is effective only if accepted by Speaker/Chairman as voluntary and genuine.",
  "article 102": "Disqualifications for MP: (a) office of profit under Government of India/State (except offices declared by Parliament not to disqualify), (b) unsound mind declared by a competent court, (c) undischarged insolvent, (d) not a citizen of India or voluntary acquisition/allegiance to a foreign State, (e) disqualification under any law made by Parliament (notably Representation of the People Act). Clause (2): disqualification also applies under Tenth Schedule (anti-defection).",
  "article 103": "Decision on disqualification questions under Article 102(1): question is decided by President, who must obtain and act according to Election Commission's opinion; this does not apply to Tenth Schedule defection cases (decided by Speaker/Chairman). Constitutional text treats President's decision as final, though courts retain limited judicial review on constitutional grounds.",
  "article 104": "Penalty for sitting/voting when disqualified or before oath: person who knowingly sits or votes without taking oath under Article 99, or when disqualified/prohibited by law, is liable to penalty of Rs. 500 for each day, recoverable as debt due to the Union.",
  "article 105": "Parliamentary powers, privileges and immunities: subject to Constitution and parliamentary rules/standing orders, there is freedom of speech in Parliament; no member is liable in court for anything said or vote given in Parliament/committee, and no liability for authorized publication of reports/papers/proceedings by or under authority of either House. Other privileges are as defined by Parliament by law; until so defined, as those of each House and members/committees existing immediately before Section 15 of the 44th Amendment came into force (20 June 1979).",
  "article 106": "Salaries and allowances of members: MPs receive salaries/allowances as Parliament may determine by law and, until provision is made, as specified in Second Schedule.",
  "article 107": "Legislative procedure for ordinary Bills (subject to Articles 109 and 117): Bill may originate in either House; pending Bill does not lapse by prorogation. On dissolution of Lok Sabha: Bill pending in Rajya Sabha (not passed by Lok Sabha) does not lapse; Bill pending in Lok Sabha, or passed by Lok Sabha and pending in Rajya Sabha, lapses.",
  "article 108": "Joint sitting of both Houses (not for Money Bills or Constitutional Amendment Bills): President may notify intention to summon joint sitting if one House rejects a Bill, Houses finally disagree on amendments, or more than 6 months elapse from receipt by other House without passage (excluding periods of prorogation or adjournment of more than 4 consecutive days). If Lok Sabha dissolves after such notification, joint sitting can still be held. Bill passes by majority of members present and voting at joint sitting; admissible amendments are restricted by constitutional rules. Presiding order: Speaker, then Deputy Speaker, then Deputy Chairman.",
  "article 109": "Special procedure for Money Bills: Money Bill can be introduced only in Lok Sabha. After Lok Sabha passes and transmits it, Rajya Sabha has 14 days to return with recommendations; Lok Sabha may accept or reject any/all recommendations. If Rajya Sabha does not return within 14 days, Bill is deemed passed in form passed by Lok Sabha. Rajya Sabha cannot amend or reject a Money Bill.",
  "article 110": "Definition of Money Bill: Bill is Money Bill only if it contains ONLY provisions dealing with matters in Article 110(1)(a)-(g) (taxation, Union borrowing/guarantees, Consolidated Fund/Contingency Fund custody/appropriation/charged expenditure, public account, audit, and incidental matters). Bill is not Money Bill merely because it provides fines/fees or local taxation. If question arises whether Bill is Money Bill, Speaker's decision is final under constitutional text; certificate must be endorsed when transmitted to Rajya Sabha and when presented to President for assent.",
  "article 111": "Assent to Bills: when a Bill is presented, President may assent or withhold assent; for a Bill other than a Money Bill, President may return it with message for reconsideration. If both Houses pass again (with or without amendments), President shall not withhold assent. Money Bills cannot be returned for reconsideration. Constitutional Amendment Bills require mandatory assent under Article 368 (post-24th Amendment).",
  "article 112": "Annual Financial Statement (Union Budget): President causes to be laid before both Houses a statement of estimated receipts/expenditure of Government of India for the financial year, showing separately expenditure charged on Consolidated Fund of India and other expenditure to be voted by Lok Sabha, and distinguishing revenue and capital accounts.",
  "article 113": "Procedure in Parliament for estimates: expenditure charged on Consolidated Fund is not submitted to vote (though discussable); other expenditure is submitted as Demands for Grants to Lok Sabha. Lok Sabha may assent, refuse, or reduce a demand, but cannot increase it. No demand for grant can be made except on President's recommendation.",
  "article 114": "Appropriation Bills: after Demands for Grants are voted, an Appropriation Bill is introduced to authorize withdrawal from Consolidated Fund for voted grants and charged expenditure. No amendment can vary amount/destination of any grant or charged expenditure; decision of presiding officer on admissibility is final.",
  "article 115": "Supplementary, additional and excess grants: if amount in Article 112 is insufficient, or need arises for new service not included in that statement, or excess expenditure has occurred for any service, President causes another statement to be laid and procedures of Articles 112-114 apply accordingly (excess grants processed after audit/PAC scrutiny by convention).",
  "article 116": "Vote on account, vote of credit and exceptional grants: Lok Sabha may make advance grant pending full budget (vote on account), grant for unexpected demand of indefinite character (vote of credit), or exceptional grant for special purpose not part of current service; these are authorized through law and governed procedurally like ordinary grants.",
  "article 117": "Special provisions as to Financial Bills: Financial Bill Category A (contains Article 110 matters plus other matters) can be introduced only in Lok Sabha and only on President's recommendation. Financial Bill Category B (involves expenditure from Consolidated Fund but no Article 110 matter) may be introduced in either House, but cannot be passed by either House unless President has recommended consideration.",
  "article 118": "Rules of procedure: each House may make rules for conduct of business (subject to Constitution). Until so made, pre-Constitution legislative rules continue with modifications. President, after consulting Speaker and Chairman, may make rules for joint sittings under Article 108.",
  "article 119": "Regulation by law of parliamentary financial procedure: Parliament may by law regulate procedure and conduct of financial business in each House; if such law conflicts with rules made by House under Article 118, the law prevails.",
  "article 120": "Language in Parliament: business shall be transacted in Hindi or English; with permission of presiding officer, a member unable to adequately express in Hindi/English may address House in mother tongue. Constitutional provision originally linked English continuation to transition period, but continuation is provided by statutory law (Official Languages Act framework).",
  "article 121": "Restriction on discussion in Parliament: no discussion shall take place regarding conduct of any Supreme Court or High Court judge in discharge of duties, except upon a motion for presenting an address to President for removal of that judge.",
  "article 122": "Courts not to inquire into parliamentary proceedings: validity of any parliamentary proceeding cannot be questioned in court on ground of alleged procedural irregularity; officers/members of Parliament exercising powers for regulating procedure, conduct of business, or maintaining order are not subject to court jurisdiction in respect of such exercise.",
  "article 123": "Ordinance-making power of President: when both Houses are not in session and President is satisfied immediate action is necessary, he may promulgate an Ordinance having same force/effect as an Act of Parliament (subject to legislative competence and constitutional limits). Ordinance must be laid before both Houses and ceases at expiry of 6 weeks from reassembly of Parliament (counted from later date if Houses reassemble on different dates), or earlier on second disapproving resolution by both Houses; President may withdraw earlier. Re-promulgation to bypass Legislature is constitutionally impermissible (D.C. Wadhwa; Krishna Kumar Singh).",
  "article 124": "Establishment and constitution of Supreme Court: consists of Chief Justice of India and other judges as Parliament may by law prescribe (current sanctioned strength under statute is 34 including CJI). Judges are appointed by President after consultation process laid down constitutionally/judicially (collegium convention in practice). Qualifications: citizen of India and either 5 years as High Court judge, or 10 years as High Court advocate, or distinguished jurist in President's opinion. Retirement age is 65 years. Removal only by President's order after address by each House in same session, supported by majority of total membership and not less than two-thirds of members present and voting, on ground of proved misbehaviour or incapacity. Resignation is by writing addressed to President.",
  "article 124A": "Article 124A created the National Judicial Appointments Commission (NJAC) and provided its composition (CJI as Chairperson, two senior-most SC judges, Union Law Minister, and two eminent persons). The NJAC framework was declared unconstitutional by Supreme Court in 2015.",
  "article 124B": "Article 124B provided functions of NJAC regarding recommendations for appointment and transfer of judges of Supreme Court and High Courts. The provision became inoperative after the 2015 Supreme Court judgment striking down NJAC scheme.",
  "article 124C": "Article 124C empowered Parliament to make law regulating procedure for NJAC's functioning and related matters. This too became ineffective after NJAC was struck down in 2015.",
  "article 125": "Salaries, allowances, leave and pension of Supreme Court judges are determined by Parliament by law and, until so provided, by Second Schedule; neither privileges nor rights regarding leave/pension, and no salary/allowance, can be varied to judge's disadvantage after appointment except under Financial Emergency (Article 360).",
  "article 126": "Acting Chief Justice of India: when office of CJI is vacant or CJI is unable to perform duties, President appoints one of the Supreme Court judges to perform duties of the office.",
  "article 127": "Ad hoc judges in Supreme Court: if at any time quorum of Supreme Court judges is unavailable, CJI may, with previous consent of President and after consultation with Chief Justice of concerned High Court, request a duly qualified High Court judge to sit as ad hoc Supreme Court judge; while so sitting, he has all jurisdiction, powers and privileges of a Supreme Court judge.",
  "article 128": "Attendance of retired judges at Supreme Court sittings: CJI may, with previous consent of President, request a retired SC/Federal Court judge or retired High Court judge duly qualified for SC appointment to sit and act as judge of Supreme Court, with that person's consent; while so sitting, he has all jurisdiction, powers and privileges of a Supreme Court judge.",
  "article 129": "Supreme Court as a Court of Record: it has power to preserve records with evidentiary authority and has power to punish for contempt of itself.",
  "article 130": "Seat of Supreme Court: Supreme Court shall sit in Delhi or in such other place/place(s) as Chief Justice of India may, with approval of President, appoint.",
  "article 131": "Original jurisdiction of Supreme Court (exclusive in specified federal disputes): applies to disputes involving Government of India and one or more States, or between States, where dispute involves existence/extent of a legal right. Proviso excludes disputes arising out of certain pre-Constitution treaties/agreements that continue in operation and provide such exclusion.",
  "article 131A": "Exclusive jurisdiction of Supreme Court to determine constitutional validity of Central laws: repealed by the 43rd Amendment Act, 1977.",
  "article 132": "Constitutional appellate jurisdiction: appeal lies to Supreme Court from any judgment/decree/final order of a High Court in civil, criminal or other proceeding if High Court certifies under Article 134A that case involves a substantial question of law as to interpretation of Constitution.",
  "article 133": "Civil appellate jurisdiction: appeal lies from High Court judgment/decree/final order in civil proceeding if High Court certifies that case involves a substantial question of law of general importance and, in High Court's opinion, that question needs to be decided by Supreme Court.",
  "article 134": "Criminal appellate jurisdiction: appeal to Supreme Court lies if High Court (a) on appeal reverses acquittal and sentences accused to death, or (b) withdraws a case from subordinate court for trial and in such trial sentences accused to death, or (c) certifies under Article 134A that case is fit for appeal to Supreme Court.",
  "article 134A": "Certificate for appeal to Supreme Court: High Court must, after passing judgment/decree/final order/sentence referred to in Articles 132(1), 133(1) or 134(1), determine whether certificate should be granted (on its own motion or on oral application by aggrieved party).",
  "article 135": "Jurisdiction and powers of Federal Court preserved residually: Supreme Court exercises such jurisdiction/powers as Federal Court had immediately before commencement of Constitution, insofar as not covered by Articles 133 or 134.",
  "article 136": "Special Leave to Appeal (SLP): Supreme Court may, in its discretion, grant special leave against any judgment/decree/determination/sentence/order in any cause or matter passed by any court or tribunal in India; express exclusion applies to courts/tribunals constituted under laws relating to the Armed Forces.",
  "article 137": "Review power of Supreme Court: subject to Parliamentary law and rules under Article 145, Supreme Court has power to review any judgment pronounced or order made by it.",
  "article 138": "Enlargement of Supreme Court jurisdiction: Parliament may by law confer further jurisdiction/powers on Supreme Court regarding matters in Union List; additional jurisdiction on other matters may also be conferred where Union and a State(s) agree by special agreement and Parliament so provides by law.",
  "article 139": "Conferment of additional writ powers: Parliament may by law empower Supreme Court to issue directions/orders/writs (including those in Article 32) for purposes other than enforcement of Fundamental Rights.",
  "article 139A": "Transfer of certain cases: where same or substantially same question of law of general importance is pending before Supreme Court and one or more High Courts, Supreme Court may withdraw High Court case(s) and decide itself; Supreme Court may also transfer cases/appeals/proceedings from one High Court to another if expedient for ends of justice (on AGI application, party application, or suo motu).",
  "article 140": "Ancillary powers of Supreme Court: Parliament may by law confer supplementary powers on Supreme Court as needed to enable it to perform functions effectively.",
  "article 141": "Law declared by Supreme Court is binding on all courts within territory of India (doctrine of precedent). Binding part is ratio decidendi; obiter observations are persuasive. Supreme Court may depart from its own earlier view in appropriate cases (usually by larger bench).",
  "article 142": "Enforcement and complete justice power: Supreme Court may pass any decree or order necessary for doing complete justice in any cause/matter before it; such decree/order is enforceable throughout India as prescribed by Parliamentary law or, until then, by Presidential order. Supreme Court may also secure attendance/discovery/punish contempt as provided.",
  "article 143": "Advisory jurisdiction of Supreme Court: President may refer to Supreme Court a question of law or fact of public importance (Court may report opinion). In matters arising from disputes under pre-Constitution treaties/agreements covered by proviso, Court shall report opinion. Presidential reference opinion is advisory (not binding like a judgment in lis).",
  "article 144": "All authorities, civil and judicial, in the territory of India shall act in aid of the Supreme Court (constitutional command ensuring compliance with SC process and judgments).",
  "article 145": "Rules of Supreme Court: subject to Parliamentary law and Presidential approval, Supreme Court may make rules regulating practice/procedure, including persons who may practice before it and review procedure. Minimum five-judge Constitution Bench required for cases involving substantial question of constitutional interpretation or Article 143 reference.",
  "article 146": "Officers and servants of Supreme Court: appointments made by CJI (or authorized judge/officer) subject to Parliamentary law; service conditions prescribed by rules made by CJI/authorized authority with Presidential approval where required. Administrative expenses of Supreme Court, including salaries/allowances/pensions, are charged on Consolidated Fund of India.",
  "article 147": "Interpretation clause for this Chapter: references to substantial question of constitutional interpretation include references to interpretation of Government of India Act, 1935 and Indian Independence Act, 1947 and their ancillary instruments.",
  "article 148": "Comptroller and Auditor-General of India: appointed by President by warrant under hand and seal. Removal only in like manner and on like grounds as Supreme Court judge. Oath as per Third Schedule. Conditions of service/salary determined by Parliament and not varied to disadvantage after appointment; post-retirement ineligible for further office under Government of India or State Government. Administrative expenses of CAG office are charged on Consolidated Fund of India.",
  "article 149": "Duties and powers of CAG are prescribed by Parliamentary law (primarily CAG's DPC Act, 1971); core function is audit of Union and State accounts including expenditure from Consolidated Fund, Contingency Fund and Public Account, and reporting thereon.",
  "article 150": "Form of accounts of Union and States shall be prescribed by President on advice of CAG, ensuring uniform and comparable government accounting framework.",
  "article 151": "Audit reports: CAG submits Union reports to President for laying before both Houses of Parliament, and State reports to Governor for laying before State Legislature. These reports form basis for legislative financial control (PAC/COPU scrutiny by convention and rules).",
  "article 152": "Definition clause for Part VI (The States): unless context otherwise requires, 'State' in this Part does not include Jammu and Kashmir; practical exam takeaway is that this Part governs constitutional structure of States.",
  "article 153": "Governors of States: there shall be a Governor for each State; by proviso, the same person may be appointed as Governor for two or more States.",
  "article 154": "Executive power of State is vested in Governor and exercised by him either directly or through officers subordinate to him in accordance with Constitution; this does not prevent conferral of functions by law on other authorities.",
  "article 155": "Appointment of Governor: Governor of a State is appointed by President by warrant under his hand and seal (appointed, not elected).",
  "article 156": "Term of Governor: holds office during pleasure of President; subject to this, normal term is 5 years from entering office. Governor may resign by writing to President and continues until successor enters office even after term expiry.",
  "article 157": "Qualifications for Governor: must be citizen of India and have completed 35 years of age.",
  "article 158": "Conditions of Governor's office: shall not be member of Parliament or State Legislature (seat deemed vacated on entering office), shall not hold any other office of profit, entitled to official residence and emoluments/allowances/privileges as determined by Parliament (or Second Schedule until then), and emoluments/allowances cannot be diminished during term; where one person is Governor of 2+ States, allocation is by President's order.",
  "article 159": "Oath/affirmation of Governor: before entering office, oath is administered by Chief Justice of High Court (or senior-most available judge), including pledge to preserve, protect and defend Constitution and law and devote self to service and well-being of people.",
  "article 160": "Discharge of Governor's functions in contingencies: President may make such provision as he thinks fit for any contingency not provided for in this Chapter.",
  "article 161": "Governor's clemency power: may grant pardons/reprieves/respites/remissions or suspend/remit/commute sentence for offences against laws on matters to which State executive power extends. Constitutional distinction from Article 72: Governor has no independent Court-Martial category and no separate all-death-sentence clause like the President.",
  "article 162": "Extent of State executive power: extends to matters on which State Legislature can make laws. In Concurrent List matters, State executive power is subject to and limited by executive power expressly conferred by Constitution or by Parliamentary law on Union or its authorities.",
  "article 163": "Council of Ministers to aid and advise Governor: Governor acts on aid and advice of CoM headed by Chief Minister except in matters where Constitution requires discretion. Constitutional text says Governor's decision on whether a matter is discretionary is final and advice is non-justiciable in court; modern judicial practice still permits limited review on constitutional grounds.",
  "article 164": "State ministers: Chief Minister appointed by Governor; other ministers appointed by Governor on CM's advice; CoM collectively responsible to Legislative Assembly. Ministers hold office during pleasure of Governor and take oath of office/secrecy. 6-month rule: non-member minister must get elected/nominated within 6 months. 91st Amendment limits total ministers (including CM) to 15% of Assembly strength, minimum 12, and disqualified defector under Tenth Schedule cannot be appointed minister during disqualification period. Proviso requires a minister in charge of Tribal Welfare in specified States (also handling SC/BC welfare as applicable).",
  "article 165": "Advocate-General for State: appointed by Governor; must be qualified for appointment as High Court judge; duty is to advise State Government on legal matters and perform legal functions assigned by Governor/Constitution; holds office during Governor's pleasure and is paid as Governor determines.",
  "article 166": "Conduct of State government business: all executive action of State Government shall be expressed in name of Governor; orders/instruments are authenticated as specified in rules and validity cannot be questioned for non-execution by Governor personally; Governor makes rules for convenient transaction/allocation of business among ministers.",
  "article 167": "Duties of Chief Minister toward Governor: communicate all CoM decisions relating to administration and legislative proposals; furnish information as Governor may call for; place before CoM any matter decided by a minister but not considered by CoM when Governor so requires.",
  "article 168": "Constitution of State Legislatures: for every State, Legislature consists of Governor and one House (Legislative Assembly), and in some States also a second House (Legislative Council) where bicameral system exists under constitutional/parliamentary arrangement.",
  "article 169": "Creation or abolition of State Legislative Council: Parliament may by law provide for abolition/creation of Council if Legislative Assembly of the concerned State passes a resolution by special majority (majority of total membership + not less than two-thirds of members present and voting). Such law is expressly not treated as a constitutional amendment under Article 368.",
  "article 170": "Composition of Legislative Assemblies: Assembly membership is not more than 500 and not less than 60, subject to specific constitutional/statutory exceptions for smaller States. Seats are filled by direct election from territorial constituencies with population-seat parity principle as far as practicable; readjustment linked to census is constitutionally deferred until first census after 2026 under amendment scheme.",
  "article 171": "Composition of Legislative Councils: total membership not more than one-third of Assembly strength and not less than 40 (subject to specific exceptions). As nearly as may be: one-third elected by local authorities, one-twelfth by graduates (of at least 3 years standing), one-twelfth by teachers (not lower than secondary level, of at least 3 years standing), one-third by Assembly members, and remainder nominated by Governor from persons with special knowledge/practical experience in literature, science, art, cooperative movement and social service.",
  "article 172": "Duration of State Legislatures: Legislative Assembly normally continues for 5 years from date appointed for first meeting unless dissolved sooner; during National Emergency, Parliament may by law extend Assembly term by one year at a time, but not beyond six months after Emergency ceases. Legislative Council is a permanent House; as nearly as possible, one-third members retire every second year.",
  "article 173": "Qualification for State Legislature membership: person must be citizen of India, make/subcribe oath or affirmation in Third Schedule form before person authorized by Election Commission, be at least 25 years for Assembly and 30 years for Council, and satisfy further qualifications prescribed by/under Parliamentary law.",
  "article 174": "Sessions/prorogation/dissolution in State Legislature: Governor summons House/each House at such time and place as he thinks fit, but six months shall not intervene between last sitting in one session and first sitting in next session; Governor may prorogue House/each House and dissolve Legislative Assembly.",
  "article 175": "Right of Governor to address and send messages: Governor may address Legislative Assembly or both Houses (where bicameral) and may require attendance for that purpose; Governor may send messages to House/Houses regarding pending Bill or otherwise, and House shall consider with all convenient dispatch.",
  "article 176": "Special Address by Governor: at commencement of first session after each general election to Assembly and at commencement of first session each year, Governor addresses Assembly or both Houses together and informs Legislature of causes of summons; House(s) discuss matters referred (Motion of Thanks convention).",
  "article 177": "Rights of Ministers and Advocate-General in State Legislature: every minister and Advocate-General has right to speak and otherwise take part in proceedings of Assembly/Council and any committee of Legislature of which he may be named member, but has no right to vote unless he is member of that House.",
  "article 178": "Speaker and Deputy Speaker of Legislative Assembly: Assembly shall, as soon as may be, choose two members as Speaker and Deputy Speaker; when either office becomes vacant, Assembly chooses another member.",
  "article 179": "Vacation/resignation/removal of Speaker or Deputy Speaker (Assembly): office vacates if person ceases to be Assembly member; Speaker may resign to Deputy Speaker and Deputy Speaker to Speaker; removal is by Assembly resolution passed by majority of all the then members with at least 14 days' notice. Proviso: Speaker does not vacate office on Assembly dissolution until immediately before first meeting of new Assembly.",
  "article 180": "Power of Deputy Speaker or other person to perform Speaker's duties: when Speaker's office is vacant, Deputy Speaker performs duties; if Deputy Speaker office also vacant, Governor appoints an Assembly member to perform duties. During absence of Speaker and Deputy Speaker from sitting, person determined by Assembly rules (or by Assembly) presides.",
  "article 181": "Speaker/Deputy Speaker not to preside during consideration of resolution for his removal: the concerned officer cannot preside though present; Speaker has right to speak/participate and may vote only in first instance (no casting vote) on his own removal resolution; same rule applies mutatis mutandis to Deputy Speaker.",
  "article 182": "Chairman and Deputy Chairman of Legislative Council: Council shall, as soon as may be, choose two members as Chairman and Deputy Chairman; when either office becomes vacant, Council shall choose another member.",
  "article 183": "Vacation/resignation/removal of Chairman or Deputy Chairman (Council): office vacates if person ceases to be Council member; Chairman may resign to Deputy Chairman and Deputy Chairman to Chairman; removal is by Council resolution passed by majority of all the then members, with at least 14 days' notice of intention to move the resolution.",
  "article 184": "Power of Deputy Chairman or other person to perform duties of Chairman: when Chairman's office is vacant, Deputy Chairman performs duties, and if Deputy Chairman office is also vacant, Governor may appoint a Council member to perform duties; during absence of Chairman and Deputy Chairman from a sitting, person determined by Council rules (or by Council) presides.",
  "article 185": "Chairman/Deputy Chairman not to preside while removal resolution is under consideration against them: they may be present, speak and otherwise take part in proceedings; on such proceedings they may vote only in first instance and are not entitled to casting vote under Article 189.",
  "article 186": "Salaries and allowances of Speaker/Deputy Speaker (Assembly) and Chairman/Deputy Chairman (Council) are as determined by State Legislature by law and, until then, as specified in Second Schedule.",
  "article 187": "Secretariat of State Legislature: each House has separate secretarial staff; State Legislature may by law regulate recruitment and service conditions. Until such law, Governor may make rules after consultation with Speaker/Chairman; provision may be made for posts common to both Houses.",
  "article 188": "Oath or affirmation by members: every member of State Legislature must, before taking seat, make/subcribe oath or affirmation in Third Schedule form before Governor or person appointed by him.",
  "article 189": "Voting in Houses: questions are decided by majority of members present and voting; Speaker/Chairman (or person acting) has casting vote in case of equality. House can act notwithstanding vacancies, and proceedings are not invalidated merely because some unauthorized person sat/voted/participated. Quorum is 10 members or one-tenth of total membership, whichever is greater.",
  "article 190": "Vacation of seats: no person can be member of both Houses of State Legislature simultaneously (vacancy regulated by State law), or member of Legislatures of two or more States simultaneously (vacancy regulated by Parliamentary law). Seat becomes vacant on disqualification under Article 191, or on resignation accepted by Speaker/Chairman as voluntary and genuine. House may declare seat vacant for absence from all meetings for 60 days without permission (excluding prorogation and adjournment periods over 4 consecutive days).",
